name: Build ReLife RAM ISO
on:
  workflow_dispatch:
  push:
    branches: [main, desktop-redesign]
    paths: ['build.sh', 'desktop/**', 'scripts/**', 'overlay/**', 'tests/**', 'windows/**', '.github/workflows/iso.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [extreme-lite, education]
    container:
      image: debian:13
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: apt-get update && apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin grub-common fdisk dosfstools mtools ca-certificates curl qemu-system-x86 ovmf python3 python3-pil cmake g++ pkg-config libudev-dev libinput-dev libpugixml-dev libcairo2-dev libx11-dev libxtst-dev libxrandr-dev libxi-dev libglib2.0-dev
      - name: Validate learning tools and build scripts
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          bash -n build.sh
          python3 tests/test_learning.py
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('overlay').rglob('*.py')]"
      - name: Build hybrid ISO
        run: bash build.sh "${{ matrix.edition }}" 2>&1 | tee build.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Build Windows boot payload and test disk
        id: payload
        if: matrix.edition == 'extreme-lite'
        run: |
          bash windows/make-payload.sh
          bash windows/make-test-disk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relife-${{ matrix.edition }}-candidate
          path: dist/${{ matrix.edition }}/*.iso
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'extreme-lite'
        with:
          name: relife-windows-payload-candidate
          path: dist/extreme-lite/ReLife-Windows-UEFI-Payload.zip
          compression-level: 0
          if-no-files-found: error
      - name: Test BIOS and UEFI offline desktop, education and shutdown
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          if [ "${{ matrix.edition }}" = extreme-lite ]; then
            python3 tests/boot.py extreme-lite --ram 1024
          else
            python3 tests/boot.py education --ram 2048
          fi
      - name: Boot the staged FAT32 loader in UEFI with no ISO attached
        if: always() && steps.payload.outcome == 'success'
        run: python3 tests/boot.py extreme-lite --ram 1024 --disk dist/extreme-lite/windows-test.img
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relife-${{ matrix.edition }}-validation
          path: |
            dist/${{ matrix.edition }}/*.png
            dist/${{ matrix.edition }}/*.json
            dist/${{ matrix.edition }}/*.log
            dist/${{ matrix.edition }}/SHA256SUMS
            dist/${{ matrix.edition }}/package-status.txt
            build.log
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Verify Windows staging and rollback on a disposable FAT32 VHD
        run: ./test-fat32.ps1
      - name: Build and run the Windows executable
        run: |
          go build -trimpath -o ReLife-Windows-Boot-Setup.exe .
          ./ReLife-Windows-Boot-Setup.exe -help
      - uses: actions/upload-artifact@v4
        with:
          name: relife-windows-setup
          path: windows/ReLife-Windows-Boot-Setup.exe
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[relife-alpha]')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-candidate'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: relife-windows-setup
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-validation'
          path: evidence
      - name: Publish tested prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp evidence/relife-extreme-lite-validation/dist/extreme-lite/VALIDATION.json release/VALIDATION-EXTREME-LITE.json
          cp evidence/relife-extreme-lite-validation/dist/extreme-lite/VALIDATION-WINDOWS-UEFI.json release/
          cp evidence/relife-education-validation/dist/education/VALIDATION.json release/VALIDATION-EDUCATION.json
          cp evidence/relife-extreme-lite-validation/dist/extreme-lite/bios-desktop.png release/ReLife-Desktop.png
          cp evidence/relife-extreme-lite-validation/dist/extreme-lite/bios-education.png release/ReLife-Education-Center.png
          cp evidence/relife-extreme-lite-validation/dist/extreme-lite/bios-files.png release/ReLife-Files.png
          (cd release && sha256sum *.iso *.exe *.zip > SHA256SUMS)
          gh release create v0.3.0-alpha.3 release/* --target "$GITHUB_SHA" \
            --prerelease --title 'ReLife RAM v0.3.0 Alpha 3' --notes-file RELEASE-NOTES.md
