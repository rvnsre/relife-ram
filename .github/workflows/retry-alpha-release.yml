name: Recover tested ReLife release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/retry-alpha-release.yml']
permissions:
  actions: read
  contents: write
concurrency:
  group: relife-alpha-release-recovery
  cancel-in-progress: true
env:
  RUN_ID: '45707814480'
  SOURCE_SHA: 7d59b11cc3853bc103764d956042595e4d2d02a0
  TAG_NAME: v0.3.0-alpha.5
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Verify the source commit and required jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- . ':(exclude).github/workflows/retry-alpha-release.yml'
          while :; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.status,.conclusion] | @tsv')
            if [[ "$result" == completed$'\t'* ]]; then
              [[ "$result" == completed$'\t'success ]]
              break
            fi
            sleep 20
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" |
            jq -e '["build (extreme-lite)", "build (education)", "windows"] - [.jobs[] | select(.conclusion == "success") | .name] | length == 0'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          pattern: '*-candidate'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          name: relife-windows-setup
          path: release
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          pattern: '*-validation'
          path: evidence
      - name: Publish the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          lite=evidence/relife-extreme-lite-validation/dist/extreme-lite
          education=evidence/relife-education-validation/dist/education
          (cd release && sha256sum -c "../$lite/SHA256SUMS" && sha256sum -c "../$education/SHA256SUMS")
          cp "$lite/VALIDATION.json" release/VALIDATION-EXTREME-LITE.json
          cp "$lite/VALIDATION-WINDOWS-UEFI.json" release/
          cp "$education/VALIDATION.json" release/VALIDATION-EDUCATION.json
          cp "$lite/bios-desktop.png" release/ReLife-Desktop.png
          cp "$lite/bios-education.png" release/ReLife-Education-Center.png
          cp "$lite/bios-files.png" release/ReLife-Files.png
          cp "$lite/bios-start.png" release/ReLife-Start.png
          cp "$lite/bios-switcher.png" release/ReLife-Window-Switcher.png
          cp "$lite/bios-network.png" release/ReLife-Network.png
          (cd release && sha256sum *.iso *.exe *.zip > SHA256SUMS)
          cat > /tmp/relife-release-notes.md <<'NOTES'
          ReLife RAM Alpha 5 includes a new light desktop theme, original violet artwork and an app search in Start. The window picker, network and power panels and education tools share the new palette and typography.

          Both images use XZ boot archives and 1 MiB SquashFS blocks with the x86 filter. Extreme Lite starts Firefox ESR on the 1 GiB BIOS and UEFI test VMs and uses compressed memory without disk swap. The attached reports include idle RAM, the Firefox network-page test, Start search and graphical shutdown. Physical Wi-Fi and touchpad support depend on the device.

          Extreme Lite focuses on older Wi-Fi adapters. Education includes the broader firmware bundle. Windows Boot Setup stages the UEFI payload on a dedicated FAT32 volume. See the repository's Windows README for installation and recovery steps.
          NOTES
          lookup() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG_NAME\")" | jq -sc 'first // empty'
          }
          release_info=$(lookup)
          for attempt in 1 2 3; do
            if [ -n "$release_info" ]; then break; fi
            if release_info=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG_NAME" -f target_commitish="$GITHUB_SHA" \
              -f name='ReLife RAM v0.3.0 Alpha 5' -f body=@/tmp/relife-release-notes.md \
              -F draft=true -F prerelease=true); then break; fi
            sleep "$((attempt * 5))"
            release_info=$(lookup)
          done
          test "$(jq -r .target_commitish <<<"$release_info")" = "$GITHUB_SHA"
          release_id=$(jq -r .id <<<"$release_info")
          upload_template=$(jq -r .upload_url <<<"$release_info")
          upload_url=${upload_template%%\{*}
          for asset in release/*.json release/*.png release/*.exe release/SHA256SUMS \
                       release/ReLife-Extreme-Lite-*.iso release/*.zip release/ReLife-Education-*.iso; do
            name=${asset##*/}
            printf 'Checking release asset %s\n' "$name"
            hash=$(sha256sum "$asset" | cut -d ' ' -f1)
            for attempt in 1 2 3; do
              digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                --jq ".[] | select(.name == \"$name\") | .digest")
              if [ "$digest" = "sha256:$hash" ]; then break; fi
              test -z "$digest"
              if curl -fsS --connect-timeout 30 --max-time 300 -o /tmp/relife-upload.json \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$asset" "$upload_url?name=$name"; then break; fi
              sleep "$((attempt * 5))"
            done
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$name\") | .digest")
            test "$digest" = "sha256:$hash"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" -X PATCH -F draft=false --jq .html_url
