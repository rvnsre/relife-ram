name: Build ReLife RAM ISO
on:
  workflow_dispatch:
  push:
    branches: [main, desktop-redesign]
    paths: ['build.sh', 'desktop/**', 'scripts/**', 'overlay/**', 'tests/**', 'windows/**', '.github/workflows/iso.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [extreme-lite, education]
    container:
      image: debian:13
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: apt-get update && apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin grub-common fdisk dosfstools mtools ca-certificates curl qemu-system-x86 ovmf librsvg2-bin python3 python3-pil cmake g++ pkg-config libudev-dev libinput-dev libpugixml-dev libcairo2-dev libx11-dev libxtst-dev libxrandr-dev libxi-dev libglib2.0-dev
      - name: Validate learning tools and build scripts
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          bash -n build.sh
          python3 tests/test_learning.py
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('overlay').rglob('*.py')]"
      - name: Build hybrid ISO
        run: bash build.sh "${{ matrix.edition }}" 2>&1 | tee build.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - name: Build Windows boot payload and test disk
        id: payload
        if: matrix.edition == 'extreme-lite'
        run: |
          bash windows/make-payload.sh
          bash windows/make-test-disk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: relife-${{ matrix.edition }}-candidate
          path: dist/${{ matrix.edition }}/*.iso
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'extreme-lite'
        with:
          name: relife-windows-payload-candidate
          path: dist/extreme-lite/ReLife-Windows-UEFI-Payload.zip
          compression-level: 0
          if-no-files-found: error
      - name: Test BIOS and UEFI offline desktop, education and shutdown
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          if [ "${{ matrix.edition }}" = extreme-lite ]; then
            python3 tests/boot.py extreme-lite --ram 1024
          else
            python3 tests/boot.py education --ram 2048
          fi
      - name: Boot the staged FAT32 loader in UEFI with no ISO attached
        if: always() && steps.payload.outcome == 'success'
        run: python3 tests/boot.py extreme-lite --ram 1024 --disk dist/extreme-lite/windows-test.img
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relife-${{ matrix.edition }}-validation
          path: |
            dist/${{ matrix.edition }}/*.png
            dist/${{ matrix.edition }}/*.json
            dist/${{ matrix.edition }}/*.log
            dist/${{ matrix.edition }}/SHA256SUMS
            dist/${{ matrix.edition }}/package-status.txt
            build.log
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache: false
      - name: Verify Windows staging and rollback on a disposable FAT32 VHD
        run: ./test-fat32.ps1
      - name: Build and run the Windows executable
        run: |
          go build -trimpath -o ReLife-Windows-Boot-Setup.exe .
          ./ReLife-Windows-Boot-Setup.exe -help
      - uses: actions/upload-artifact@v4
        with:
          name: relife-windows-setup
          path: windows/ReLife-Windows-Boot-Setup.exe
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[relife-alpha]')
    needs: [build, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-candidate'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: relife-windows-setup
          path: release
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-validation'
          path: evidence
      - name: Publish the verified assets
        env:
          TAG_NAME: v0.3.0-alpha.7
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          lite=evidence/relife-extreme-lite-validation/dist/extreme-lite
          education=evidence/relife-education-validation/dist/education
          (cd release && sha256sum -c "../$lite/SHA256SUMS" && sha256sum -c "../$education/SHA256SUMS")
          cp "$lite/VALIDATION.json" release/VALIDATION-EXTREME-LITE.json
          cp "$lite/VALIDATION-WINDOWS-UEFI.json" release/
          cp "$education/VALIDATION.json" release/VALIDATION-EDUCATION.json
          cp "$lite/bios-desktop.png" release/ReLife-Desktop.png
          cp "$lite/bios-education.png" release/ReLife-Education-Center.png
          cp "$lite/bios-files.png" release/ReLife-Files.png
          cp "$lite/bios-start.png" release/ReLife-Start.png
          cp "$lite/bios-switcher.png" release/ReLife-Window-Switcher.png
          cp "$lite/bios-home.png" release/ReLife-Firefox-Home.png
          cp "$lite/bios-network.png" release/ReLife-Network.png
          (cd release && sha256sum *.iso *.exe *.zip > SHA256SUMS)
          cat > /tmp/relife-release-notes.md <<'NOTES'
          ReLife RAM Alpha 7 opens offline learning directly from Firefox Home, identifies apps in the window chooser, and updates the panel on link and keyboard events. Click the language indicator to switch layouts.

          Both images use XZ boot archives and 1 MiB SquashFS blocks with the x86 filter. Extreme Lite starts Firefox ESR on the 1 GiB BIOS and UEFI test VMs and uses compressed memory without disk swap. The attached reports include idle RAM, the Firefox network-page test, Start search and graphical shutdown. Physical Wi-Fi and touchpad support depend on the device.

          Extreme Lite focuses on older Wi-Fi adapters. Education includes the broader firmware bundle. Windows Boot Setup stages the UEFI payload on a dedicated FAT32 volume. See the repository's Windows README for installation and recovery steps.
          NOTES
          lookup() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG_NAME\")" | jq -sc 'first // empty'
          }
          release_info=$(lookup)
          for attempt in 1 2 3; do
            if [ -n "$release_info" ]; then break; fi
            if release_info=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG_NAME" -f target_commitish="$GITHUB_SHA" \
              -f name='ReLife RAM v0.3.0 Alpha 7' -f body=@/tmp/relife-release-notes.md \
              -F draft=true -F prerelease=true); then break; fi
            sleep "$((attempt * 5))"
            release_info=$(lookup)
          done
          test "$(jq -r .target_commitish <<<"$release_info")" = "$GITHUB_SHA"
          release_id=$(jq -r .id <<<"$release_info")
          upload_template=$(jq -r .upload_url <<<"$release_info")
          upload_url=${upload_template%%\{*}
          for asset in release/*.json release/*.png release/*.exe release/SHA256SUMS \
                       release/ReLife-Extreme-Lite-*.iso release/*.zip release/ReLife-Education-*.iso; do
            name=${asset##*/}
            printf 'Checking release asset %s\n' "$name"
            hash=$(sha256sum "$asset" | cut -d ' ' -f1)
            for attempt in 1 2 3; do
              digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
                --jq ".[] | select(.name == \"$name\") | .digest")
              if [ "$digest" = "sha256:$hash" ]; then break; fi
              test -z "$digest"
              if curl -fsS --connect-timeout 30 --max-time 300 -o /tmp/relife-upload.json \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
                --data-binary "@$asset" "$upload_url?name=$name"; then break; fi
              sleep "$((attempt * 5))"
            done
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$name\") | .digest")
            test "$digest" = "sha256:$hash"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" -X PATCH -F draft=false --jq .html_url
