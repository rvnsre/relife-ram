<touchégg>
  <settings><property name="animation_delay">0</property></settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND"><repeat>false</repeat><command>xdotool key --clearmodifiers alt+Tab</command><on>end</on><animate>false</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND"><repeat>false</repeat><command>xdotool key --clearmodifiers alt+shift+Tab</command><on>end</on><animate>false</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND"><repeat>true</repeat><command>relife-volume up</command><decreaseCommand>relife-volume down</decreaseCommand><times>5</times><animate>false</animate></action>
    </gesture>
    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND"><repeat>true</repeat><command>relife-volume down</command><decreaseCommand>relife-volume up</decreaseCommand><times>5</times><animate>false</animate></action>
    </gesture>
  </application>
</touchégg>
