<!doctype html><html lang="az"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ReLife Education Center</title><style>body{font:18px system-ui,sans-serif;max-width:850px;margin:30px auto;padding:18px;background:#f3f5f7;color:#172b40}section{background:white;padding:20px;margin:14px 0;border:1px solid #c6d3df}input,textarea,button{font:inherit;padding:9px;margin:6px 0;max-width:95%}textarea{width:95%}button{cursor:pointer}button:focus,input:focus,textarea:focus{outline:3px solid #1759aa}nav a{margin-right:16px}@media print{nav,button,input,textarea{display:none}}</style><h1>ReLife — Təhsil mərkəzi</h1><p>İnternetsiz işləyir. Qeydlərinizi ayrıca fayl kimi endirin; müvəqqəti RAM sessiyasında məlumatlar yenidən açılış zamanı silinə bilər.</p><nav><a href="#learn">Məşq</a><a href="#teacher">Müəllim</a><a href="#notes">Qeydlər</a><a href="#science">Elm</a></nav><section id="learn"><h2>Yaddaşdan cavablandır</h2><label>Sual <input id="q"></label><br><label>Cavab <input id="a"></label><br><button id="add">Kart əlavə et</button><p id="question"></p><label>Öz cavabın <input id="attempt"></label><button id="reveal">Cavabı göstər</button><p id="answer" aria-live="polite"></p><button id="again">Təkrar et</button><button id="known">Bildim</button><p id="due"></p><button id="export">Kartları endir</button><label>Kartları aç <input id="import" type="file" accept=".json"></label></section><section id="teacher"><h2>Müəllim üçün dərs planı</h2><label>Mövzu <input id="topic"></label><br><label>Təlim nəticəsi <textarea id="goal"></textarea></label><button id="plan">Plan hazırla</button><pre id="sheet" style="white-space:pre-wrap"></pre><button onclick="window.print()">Çap et</button></section><section id="notes"><h2>Qeydlər</h2><textarea id="note" rows="8"></textarea><button id="save">Mətn faylı endir</button></section><section id="science"><h2>Riyaziyyat laboratoriyası</h2><p>Ohm qanunu: U = I × R</p><label>Cərəyan (A) <input type="number" id="i" value="2"></label><br><label>Müqavimət (Ω) <input type="number" id="r" value="5"></label><button id="calc">Hesabla</button><p id="result" aria-live="polite"></p></section><script>
"use strict";const el=id=>document.getElementById(id);let cards=[],current=null;const day=86400000;function show(){current=cards.filter(c=>c.due<=Date.now()).sort((a,b)=>a.due-b.due)[0]||null;el("question").textContent=current?current.q:"Təkrar vaxtı çatmış kart yoxdur.";el("answer").textContent="";el("attempt").value="";el("due").textContent="Kart sayı: "+cards.length}function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}el("add").onclick=()=>{const q=el("q").value.trim(),a=el("a").value.trim();if(q&&a&&cards.length<10000){cards.push({q,a,due:Date.now(),interval:0});el("q").value=el("a").value="";show()}};el("reveal").onclick=()=>{if(current)el("answer").textContent=current.a};function rate(ok){if(!current)return;current.interval=ok?Math.min(90,Math.max(1,current.interval*2)):0;current.due=Date.now()+(ok?current.interval*day:60000);show()}el("again").onclick=()=>rate(false);el("known").onclick=()=>rate(true);el("export").onclick=()=>download("relife-cards.json",JSON.stringify(cards),"application/json");el("import").onchange=async e=>{try{const f=e.target.files[0];if(!f||f.size>2000000)throw Error();const x=JSON.parse(await f.text());if(!Array.isArray(x)||x.length>10000||!x.every(c=>c&&typeof c.q==="string"&&typeof c.a==="string"&&Number.isFinite(c.due)&&Number.isFinite(c.interval)&&c.interval>=0&&c.interval<=90))throw Error();cards=x;show()}catch{alert("Etibarsız kart faylı")}};el("plan").onclick=()=>{el("sheet").textContent=["Mövzu: "+el("topic").value,"Təlim nəticəsi: "+el("goal").value,"5 dəq — İlkin bilik yoxlaması","10 dəq — İzah və işlənmiş nümunə","10 dəq — İdarə olunan məşq","15 dəq — Müstəqil tapşırıq","5 dəq — Yekun və təkrar planı"].join("\n")};el("save").onclick=()=>download("relife-notes.txt",el("note").value,"text/plain");el("calc").onclick=()=>{const i=el("i").valueAsNumber,r=el("r").valueAsNumber;el("result").textContent=Number.isFinite(i)&&Number.isFinite(r)&&r>=0?"U = "+i*r+" V":"Düzgün ədədlər daxil edin."};show();</script></html>
