name: Build ReLife RAM ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build.sh', 'overlay/**', 'tests/**', 'windows/**', '.github/workflows/iso.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [extreme-lite, education]
    container:
      image: debian:13
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: apt-get update && apt-get install -y live-build debootstrap xorriso squashfs-tools isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin dosfstools mtools ca-certificates curl qemu-system-x86 ovmf python3 python3-pil
      - name: Validate learning tools and build scripts
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          bash -n build.sh
          python3 tests/test_learning.py
          python3 -c "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('overlay').rglob('*.py')]"
      - name: Build hybrid ISO
        run: bash build.sh "${{ matrix.edition }}" 2>&1 | tee build.log
        shell: bash --noprofile --norc -eo pipefail {0}
      - uses: actions/upload-artifact@v4
        with:
          name: relife-${{ matrix.edition }}-candidate
          path: dist/${{ matrix.edition }}/*.iso
          compression-level: 0
          if-no-files-found: error
      - name: Test BIOS and UEFI offline desktop, education and shutdown
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          if [ "${{ matrix.edition }}" = extreme-lite ]; then
            python3 tests/boot.py extreme-lite --ram 1024
          else
            python3 tests/boot.py education --ram 2048
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relife-${{ matrix.edition }}-validation
          path: |
            dist/${{ matrix.edition }}/*.png
            dist/${{ matrix.edition }}/*.json
            dist/${{ matrix.edition }}/*.log
            dist/${{ matrix.edition }}/SHA256SUMS
            dist/${{ matrix.edition }}/package-status.txt
            build.log
          if-no-files-found: error
          retention-days: 14
